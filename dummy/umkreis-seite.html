    if (V.einheit === "meter") return "<b>" + fmtM(m) + "</b>";
    if (V.einheit === "gehzeit") return "<b>" + fmtGeh(m).replace(" zu Fuß", "") + "</b><small>zu Fuß</small>";
    return "<b>" + fmtGeh(m).replace(" zu Fuß", "") + "</b><small>" + fmtM(m) + " Luftlinie</small>";
  }

  function tray(id, items, m) {
    var k = DATA.kantinen.filter(function (x) { return x.id === id; })[0];
    return '<section class="tray"><div class="tray-head"><div><h2>' + esc(k.name) + '</h2><div class="where">' + esc(k.adresse) + '</div></div><div class="dist">' + distHtml(m) + "</div></div>" +
      items.map(function (d) {
        var t = TAG[d.art] || ["t-veg", d.art];
        return '<div class="dish"><span>' + esc(d.g) + '</span><span class="p">' + euro(d.preis) + '</span><span class="tag ' + t[0] + '">' + t[1] + "</span></div>";
      }).join("") + "</section>";
  }

  function renderList(r) {
    var g = {}; r.hits.forEach(function (d) { (g[d.k] = g[d.k] || []).push(d); });
    var ids = Object.keys(g).sort(function (a, b) { return S.sort === "naehe" ? r.dist[a] - r.dist[b] : ORDER.indexOf(a) - ORDER.indexOf(b); });
    var html = "";
    if (!ids.length) {
      var next = r.facet.filter(function (f) { return f.gerichte > 0 && (S.radius == null || f.r > S.radius); })[0];
      html = '<div class="empty"><b>Im Umkreis von ' + fmtR(S.radius) + " gibt es heute " + (S.veg ? "nichts Vegetarisches" : "keine Kantine") + ".</b>" +
        (next ? "<span>Bei " + fmtR(next.r) + " wären es " + next.kantinen + " Kantine" + (next.kantinen === 1 ? "" : "n") + " mit " + next.gerichte + " Gericht" + (next.gerichte === 1 ? "" : "en") + ".</span>" +
          '<button class="btn" data-r="' + next.r + '">Auf ' + fmtR(next.r) + " erweitern</button>" : "<span>Auch im weiteren Umkreis nichts gefunden.</span>") + "</div>";
    } else if (V.gruppen === "ringe" && S.sort === "naehe") {
      var last = -1;
      ids.forEach(function (id) {
        var m = r.dist[id], ring = RINGE.filter(function (x) { return m <= x; })[0] || null;
        if (ring !== last) {
          var i = RINGE.indexOf(ring);
          html += '<div class="ring">' + (ring == null ? "Weiter als 5 km" : i === 0 ? "Unter " + fmtR(ring) : fmtR(RINGE[i - 1]) + " – " + fmtR(ring)) + "</div>";
          last = ring;
        }
        html += tray(id, g[id], m);
      });
    } else ids.forEach(function (id) { html += tray(id, g[id], r.dist[id]); });
    $("list").innerHTML = html;
    var nk = ids.length;
    $("count").textContent = r.hits.length + " Gerichte in " + nk + " Kantine" + (nk === 1 ? "" : "n") + (S.radius ? " im Umkreis von " + fmtR(S.radius) : "") + " um " + r.o.name;
  }

  // Schematische Karte (lokale Projektion, keine Kacheln)
  function renderMap(r) {
    if (V.karte !== "an") { $("map").innerHTML = ""; return; }
    var W = 760, H = 300, o = r.o, R = S.radius || 5000;
    var span = Math.max(R * 1.25, 1200); // Meter je halbe Höhe
    var mPerLat = 111320, mPerLon = 111320 * Math.cos(o.lat * Math.PI / 180);
    var scale = (H / 2) / span;
    function xy(lat, lon) { return [W / 2 + (lon - o.lon) * mPerLon * scale, H / 2 - (lat - o.lat) * mPerLat * scale]; }
    var inR = {}; r.hits.forEach(function (d) { inR[d.k] = 1; });
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Schematische Karte der Kantinen um ' + esc(o.name) + '">' +
      '<rect width="' + W + '" height="' + H + '" fill="var(--bg)"></rect>' +
      (S.radius ? '<circle cx="' + W / 2 + '" cy="' + H / 2 + '" r="' + S.radius * scale + '" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-dasharray="5 4"></circle>' : "") +
      (function () {
        // Beschriftungen ohne Überlappung: rechts, links, darüber oder darunter, was zuerst frei ist
        var boxes = [[W / 2 - 4, H / 2 - 22, W / 2 + 10 + o.name.length * 7, H / 2 - 4]], out = "";
        var hit = function (b) { return boxes.some(function (c) { return b[0] < c[2] && b[2] > c[0] && b[1] < c[3] && b[3] > c[1]; }); };
        DATA.kantinen.slice().sort(function (a, b) { return xy(b.lat, b.lon)[1] - xy(a.lat, a.lon)[1]; }).forEach(function (k) {
          var p = xy(k.lat, k.lon), on = !!inR[k.id];
          if (p[0] < -20 || p[0] > W + 20 || p[1] < -20 || p[1] > H + 20) return;
          var name = k.name.replace(/ \(.*\)/, ""), tw = name.length * 6.6;
          var opts = [[p[0] + 11, p[1] + 4, "start"], [p[0] - 11, p[1] + 4, "end"], [p[0], p[1] - 12, "middle"], [p[0], p[1] + 20, "middle"]];
          var pick = opts[0];
          for (var i = 0; i < opts.length; i++) {
            var q = opts[i], x0 = q[2] === "start" ? q[0] : q[2] === "end" ? q[0] - tw : q[0] - tw / 2;
            var b = [x0 - 2, q[1] - 12, x0 + tw + 2, q[1] + 3];
            if (!hit(b) && b[0] >= 0 && b[2] <= W) { pick = q; boxes.push(b); break; }
            if (i === opts.length - 1) boxes.push(b);
          }
          boxes.push([p[0] - 8, p[1] - 8, p[0] + 8, p[1] + 8]);
          out += '<g><circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="7" fill="' + (on ? "var(--accent)" : "var(--surface)") + '" stroke="' + (on ? "var(--accent)" : "var(--muted)") + '" stroke-width="2"></circle>' +
            '<text x="' + pick[0].toFixed(1) + '" y="' + pick[1].toFixed(1) + '" text-anchor="' + pick[2] + '" font-size="12" fill="' + (on ? "var(--ink)" : "var(--muted)") + '">' + esc(name) + "</text></g>";
        });
        return out;
      })() +
      '<g><circle cx="' + W / 2 + '" cy="' + H / 2 + '" r="6" fill="var(--pork)"></circle><text x="' + (W / 2 + 10) + '" y="' + (H / 2 - 8) + '" font-size="12" font-weight="600" fill="var(--ink)">' + esc(o.name) + "</text></g></svg>";
    $("map").innerHTML = '<div class="map">' + svg + '<div class="cap">Schema ohne Kartenkacheln, maßstabsgetreu um den Mittelpunkt. Gefüllt = im Radius.</div></div>';
  }

  function render() {
    var r = compute();
    $("ort").value = String(S.ort); $("veg").checked = S.veg;
    renderRadius(r); renderList(r); renderMap(r);
    Array.prototype.forEach.call(document.querySelectorAll(".variants button"), function (b) { b.setAttribute("aria-pressed", String(V[b.dataset.v] === b.dataset.x)); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function (b) { b.setAttribute("aria-pressed", String(S.sort === b.dataset.sort)); });
  }

  $("ort").innerHTML = DATA.orte.map(function (o, i) { return '<option value="' + i + '">' + esc(o.name) + "</option>"; }).join("");
  $("ort").addEventListener("change", function () { S.ort = +this.value; render(); });
  $("veg").addEventListener("change", function () { S.veg = this.checked; render(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.v) { V[b.dataset.v] = b.dataset.x; render(); }
    else if (b.dataset.r) { S.radius = b.dataset.r === "alle" ? null : +b.dataset.r; render(); }
    else if (b.dataset.sort) { S.sort = b.dataset.sort; render(); }
  });
  render();
})();
</script>
</body>
</html>
